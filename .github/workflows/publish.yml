# Sorbet UI - Publish to npm
#
# Publishes only when the owner publishes a GitHub release (for example tag v0.1.0).
# A push to any branch never publishes.
#
# Owner setup:
# 1. Create the npm scope and an automation (or granular) token with publish rights.
# 2. Save it as the repository secret NPM_TOKEN.
# 3. Set the package versions (pnpm changeset version), merge to main, then publish a
#    GitHub release whose tag is v<version>, for example v0.1.0.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Nothing was published."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # No dependency cache in the job that publishes: a cache written by another
          # workflow must never end up inside a released package.
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            private=$(node -p "require('./$pkg').private === true")
            [ "$private" = "true" ] && continue
            version=$(node -p "require('./$pkg').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is at $version but the release tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Build Packages
        run: pnpm build:packages

      - name: Type Check
        run: pnpm type-check

      - name: Unit Tests
        run: pnpm test:ci

      # Publishes every non-private package under packages/ whose version is not on npm yet.
      - name: Publish
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
